[project]
name = "scrapewatch"
version = "0.1.0"
description = "Config-driven web scrapers with failure monitoring (selector breakage, drift, blocking, volume) feeding a bronze/silver/gold lake on Azure Data Lake Storage Gen2."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "parsel>=1.9",
    "playwright>=1.48",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pyarrow>=17",
    "azure-storage-blob>=12.23",
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
azure-ad = ["azure-identity>=1.19"]  # DefaultAzureCredential instead of a connection string

[project.scripts]
scrapewatch = "scrapewatch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
airflow = ["apache-airflow>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits books/quotes.toscrape.com", "browser: needs Playwright Chromium"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
