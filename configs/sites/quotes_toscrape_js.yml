name: quotes_toscrape_js
description: The same quotes rendered client-side by JavaScript (/js/). The raw HTML has no div.quote, so this needs a browser.
start_urls: [https://quotes.toscrape.com/js/]
fetcher: browser
wait_for_css: div.quote
item_css: div.quote
fields:
  text:   {css: "span.text", required: true}
  author: {css: "small.author", required: true}
  tags:   {css: "a.tag", many: true}
key_fields: [text, author]
pagination: {next_css: "li.next a", max_pages: 20}
rate_limit: {requests_per_second: 1}
