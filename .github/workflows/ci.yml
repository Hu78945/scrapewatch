name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Azurite runs as a step, not a service, because services can't pass --skipApiVersionCheck
      # (the pinned Azure SDK sends an API version newer than the emulator image knows).
      - name: Start Azurite (the ADLS-backed lake tests run against it instead of being skipped)
        run: docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.35.0 azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
      - uses: astral-sh/setup-uv@v6
      - name: Install (Python 3.12, dev + airflow groups)
        run: uv sync --all-groups --python 3.12
      - name: Playwright Chromium (browser fetcher test on the local JS-rendered site)
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Lint + tests (offline; no request leaves the runner except to the local test site and Azurite)
        run: make test
      - name: Fault-detection benchmark
        run: make faultbench

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: make tf
